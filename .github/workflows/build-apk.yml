name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Create Android project
        run: npx cap add android

      - name: Apply app icon
        run: bash scripts/apply-icons.sh

      - name: Sync web files
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ifraz-app-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ifraz-app.apk
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest ifraz-app.apk \
            --title "إفراز الأراضي (آخر نسخة)" \
            --notes "ملف APK جاهز للتثبيت على الأندرويد. تُحدَّث هذه النسخة تلقائياً مع كل تعديل." \
            --latest
